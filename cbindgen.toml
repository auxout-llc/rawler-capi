language = "C"
include_guard = "RAWLER_CAPI_H_"
cpp_compat = true
usize_is_size_t = true
header = """/*
 * SPDX-License-Identifier: LGPL-2.1
 * rawler-capi — a plain C ABI over rawler (https://github.com/dnglab/dnglab).
 * Generated by cbindgen from src/lib.rs. Do not edit; run scripts/gen-headers.sh.
 */"""
[export]
include = ["RlcMetadata", "RlcImageDesc", "RlcCfa"]
[export.rename]
"RlcFile" = "rlc_file"
"RlcImage" = "rlc_image"
"RlcMetadata" = "rlc_metadata"
"RlcImageDesc" = "rlc_image_desc"
"RlcCfa" = "rlc_cfa"
[enum]
prefix_with_name = false
[const]
allow_static_const = false
